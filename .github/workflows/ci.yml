name: ci

# CPU test suite (pytest) with the full test dependencies, including torch (CPU), langdetect and NLTK data.
# auto-merge.yml requires the `test` check to pass on the PR head, as well as `review/adversarial`.
# dispatch-after-auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Fetch NLTK data (IFEval checkers)
        run: python -c "import nltk; assert nltk.download('punkt_tab', quiet=True) and nltk.download('punkt', quiet=True)"
      - name: Run tests
        run: python -m pytest -q
