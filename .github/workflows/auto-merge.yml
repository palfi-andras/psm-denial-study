name: auto-merge

# Merges a ready PR (squash) the moment its gate is green. Event-driven: runs when a review or CI run finishes.
# Ported from palfi-andras/preflight.
#
# Why not GitHub's native auto-merge: on a private repo without a required check (branch protection / rulesets need
# GitHub Pro there), GitHub refuses to arm auto-merge on a PR that is already mergeable, so it never waits for the
# review. This job is the gate instead: `review/adversarial` must be `success` on the PR head, and no check run on
# the head may be failing or still running. No secret is needed, and no PR code is checked out or run here.
#
# A merge made with GITHUB_TOKEN starts no `push` workflows. Any workflow that must run after a merge to main should
# also have `workflow_dispatch:` and the line `# dispatch-after-auto-merge` in its file; this job dispatches it.
#
# Left alone: drafts, fork PRs, PRs labelled `do-not-merge` or `needs-andras`, and PRs that touch
# .github/workflows/ (GITHUB_TOKEN may not write workflow files). For those, the authoring Claude thread merges the
# PR itself once `review/adversarial` is green.
on:
  workflow_run:
    # Add the name of any new CI workflow here so a late-finishing CI run also triggers a merge attempt.
    workflows: [Adversarial PR review, ci]
    types: [completed]
  workflow_dispatch:

# One merger at a time; a run that arrives while another works waits and re-scans every open PR.
concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    # Runs from main's copy of this file. Skip runs that were not about a PR.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'issue_comment')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      statuses: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge every ready PR whose gate is green
        run: |
          set -uo pipefail
          merged=false
          for pr in $(gh api "repos/$GH_REPO/pulls?state=open&base=main&per_page=100" --jq '.[] | select(.draft == false and .head.repo.full_name == "'"$GH_REPO"'") | .number'); do
            labels=$(gh api "repos/$GH_REPO/issues/$pr/labels" --jq '.[].name') || continue
            if grep -qxE 'do-not-merge|needs-andras' <<<"$labels"; then echo "#$pr is labelled $(tr '\n' ' ' <<<"$labels"): not merging."; continue; fi
            sha=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha) || continue
            rev_ok=$(gh api "repos/$GH_REPO/commits/$sha/status" --jq '[.statuses[] | select(.context == "review/adversarial")][0].state // ""')
            if [ "$rev_ok" != success ]; then echo "#$pr: review/adversarial is '${rev_ok:-missing}' on ${sha:0:7}."; continue; fi
            # Every other check run on the head must have finished without failing.
            bad=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "review" and .name != "stop" and .name != "merge") | select(.status != "completed" or ((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not)) | .name] | join(", ")') || continue
            if [ -n "$bad" ]; then echo "#$pr: checks not green yet: $bad."; continue; fi
            files=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" --jq '.[] | .filename, (.previous_filename // empty)') || continue
            if grep -q '^\.github/workflows/' <<<"$files"; then
              echo "#$pr touches .github/workflows/: the authoring thread merges it."
              already=$(gh api "repos/$GH_REPO/issues/$pr/comments" --jq '[.[] | select(.body | contains("<!-- auto-merge:workflow-files -->"))] | length')
              if [ "$already" = 0 ]; then
                gh api -X POST "repos/$GH_REPO/issues/$pr/comments" -f body="<!-- auto-merge:workflow-files -->
          Review passed, but this PR changes \`.github/workflows/\`, which the auto-merge bot is not allowed to write. The authoring Claude thread should merge it now (squash)." >/dev/null || true
              fi
              continue
            fi
            # mergeable_state is computed lazily: ask a few times before giving up.
            state=""
            for _ in 1 2 3 4; do
              state=$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.mergeable_state')
              [ "$state" != unknown ] && break
              sleep 5
            done
            case "$state" in clean|unstable|has_hooks) ;; *) echo "#$pr is $state: not merging."; continue ;; esac
            title=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .title)
            if gh api -X PUT "repos/$GH_REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$sha" -f commit_title="$title (#$pr)" >/dev/null; then
              echo "Merged #$pr."
              merged=true
            else
              echo "#$pr: merge refused (conflict or a race); left as it is."
            fi
          done
          echo "merged=$merged" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.merged == 'true'
        with:
          ref: main
          sparse-checkout: .github/workflows

      - name: Dispatch post-merge workflows on main
        if: env.merged == 'true'
        run: |
          for f in $(grep -l '^# dispatch-after-auto-merge' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null); do
            echo "Dispatching $(basename "$f") on main."
            gh workflow run "$(basename "$f")" --ref main || echo "::warning::could not dispatch $f"
          done
